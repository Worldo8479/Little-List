<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="title desc"><title id="title">How Little List works</title><desc id="desc">Authorized email, calendar and messages are read by an assistant. It updates a local feed that Little List displays. Manual tasks and checkmarks stay in a separate local file.</desc><rect width="900" height="580" rx="24" fill="#e9eee5"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="450" y="60" font-size="12" letter-spacing="2" fill="#637b65">YOUR SOURCES. ONE LITTLE LIST.</text><g fill="#f9fbf6" stroke="#d1ddcc"><rect x="55" y="100" width="240" height="60" rx="13"/><rect x="330" y="100" width="240" height="60" rx="13"/><rect x="605" y="100" width="240" height="60" rx="13"/></g><g font-size="16" fill="#405c45"><text x="175" y="137">Email</text><text x="450" y="137">Calendar</text><text x="725" y="137">Messages + LMS</text></g><path d="M175 160v40h550v-40M450 160v75" fill="none" stroke="#9cb29a" stroke-width="2"/><path d="m445 228 5 7 5-7" fill="none" stroke="#9cb29a" stroke-width="2"/><rect x="225" y="235" width="450" height="90" rx="16" fill="#2e624b"/><text x="450" y="271" font-size="23" fill="#fff">Your authorized assistant</text><text x="450" y="297" font-size="13" fill="#d0e2d0">Reads requests · records deadlines · preserves context</text><path d="M450 325v38" stroke="#9cb29a" stroke-width="2"/><text x="450" y="387" font-size="14" fill="#49654b">Local feed.json</text><path d="M450 401v34m-5-7 5 7 5-7" fill="none" stroke="#9cb29a" stroke-width="2"/><rect x="300" y="435" width="300" height="66" rx="14" fill="#fcfdf9" stroke="#bccfb5"/><text x="450" y="475" font-size="22" fill="#294b38">Little List</text><text x="450" y="541" font-size="12" fill="#6e826c">Manual tasks + checkmarks live separately in local.json</text></g></svg>