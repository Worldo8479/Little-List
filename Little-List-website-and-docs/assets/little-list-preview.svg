<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">Little List, illustrated preview</title><desc id="desc">A Mac menu bar and task panel with fictional school tasks.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#dce5da"/><stop offset="1" stop-color="#b7cbbc"/></linearGradient><filter id="shadow" x="-50%" y="-30%" width="200%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#183a2c" flood-opacity=".16"/></filter></defs><rect width="1120" height="760" rx="24" fill="url(#bg)"/><circle cx="120" cy="660" r="350" fill="#e8ece0" opacity=".5"/><circle cx="1090" cy="180" r="320" fill="#91af9a" opacity=".2"/><g font-family="Arial,Helvetica,sans-serif"><rect width="1120" height="40" fill="#f5f7f0" opacity=".8"/><text x="28" y="26" font-size="13" fill="#43594a">Little List</text><rect x="731" y="6" width="47" height="28" rx="7" fill="#d0dbcd"/><text x="742" y="25" font-size="17" fill="#254c3d">☷ 3</text><text x="930" y="25" font-size="12" fill="#43594a">Mon  9:41</text><rect x="560" y="53" width="410" height="634" rx="19" fill="#fbfcf9" filter="url(#shadow)"/><text x="589" y="99" font-size="26" font-weight="700" fill="#263e32">Little List</text><text x="589" y="122" font-size="12" fill="#778379">A little less to keep in your head.</text><rect x="895" y="76" width="46" height="48" rx="12" fill="#e1eee8"/><text x="918" y="108" text-anchor="middle" font-size="25" fill="#277360">3</text><rect x="586" y="146" width="358" height="35" rx="9" fill="#e8ece6"/><rect x="589" y="149" width="176" height="29" rx="7" fill="#fff"/><text x="677" y="168" text-anchor="middle" font-size="12" fill="#263e32">School</text><text x="853" y="168" text-anchor="middle" font-size="12" fill="#6c796e">Personal</text><rect x="586" y="194" width="358" height="33" rx="8" fill="#e8ece6"/><rect x="589" y="197" width="116" height="27" rx="6" fill="#fff"/><g text-anchor="middle" font-size="11" fill="#57675b"><text x="647" y="215">To do</text><text x="766" y="215">Done</text><text x="884" y="215">Sources</text></g><rect x="586" y="244" width="358" height="42" rx="9" fill="#f0f2ed"/><text x="600" y="270" font-size="12" fill="#859086">Add a little to-do…</text><text x="919" y="271" font-size="22" fill="#32816b">+</text><rect x="586" y="302" width="358" height="90" rx="11" fill="#f0f3ed"/><circle cx="605" cy="325" r="8" fill="none" stroke="#3c8770" stroke-width="1.5"/><text x="625" y="326" font-size="13" font-weight="600" fill="#2e4035">Finish the practice questions</text><text x="625" y="344" font-size="10" fill="#3b8069">School LMS</text><text x="625" y="361" font-size="10" fill="#7b867d">Review your notes before next class.</text><text x="625" y="378" font-size="9" fill="#7b867d">Due 5 November</text><text x="920" y="326" font-size="14" fill="#7b867d">↗</text><rect x="586" y="404" width="358" height="90" rx="11" fill="#f0f3ed"/><circle cx="605" cy="427" r="8" fill="none" stroke="#3c8770" stroke-width="1.5"/><text x="625" y="428" font-size="13" font-weight="600" fill="#2e4035">Bring your sketchbook</text><text x="625" y="446" font-size="10" fill="#3b8069">School Gmail</text><text x="625" y="463" font-size="10" fill="#7b867d">Pack it with your art materials.</text><text x="625" y="480" font-size="9" fill="#7b867d">Due 6 November</text><text x="920" y="428" font-size="14" fill="#7b867d">↗</text><rect x="586" y="506" width="358" height="90" rx="11" fill="#f0f3ed"/><circle cx="605" cy="529" r="8" fill="none" stroke="#3c8770" stroke-width="1.5"/><text x="625" y="530" font-size="13" font-weight="600" fill="#2e4035">Prepare for the group project</text><text x="625" y="548" font-size="10" fill="#3b8069">School Calendar</text><text x="625" y="565" font-size="10" fill="#7b867d">Bring one idea to discuss.</text><text x="625" y="582" font-size="9" fill="#7b867d">Due 9 November</text><text x="920" y="530" font-size="14" fill="#7b867d">↗</text><text x="765" y="618" text-anchor="middle" font-size="10" fill="#879186">Checking a task off only changes this list.</text><path d="M586 637h358" stroke="#e0e6dc"/><circle cx="593" cy="657" r="3" fill="#3c8770"/><text x="604" y="661" font-size="10" fill="#7b867d">Updated just now</text><text x="923" y="662" font-size="15" fill="#7b867d">⚙</text><text x="75" y="300" font-size="11" letter-spacing="2" fill="#4a6855">RIGHT WHERE YOU NEED IT</text><text x="72" y="360" font-size="48" letter-spacing="-2" fill="#294b38">Your day.</text><text x="72" y="414" font-size="48" letter-spacing="-2" fill="#294b38">A little clearer.</text><text x="75" y="460" font-size="14" fill="#627b67">Less searching. More headspace.</text></g></svg>